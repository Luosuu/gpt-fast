[project]
name = "gpt-fast"
version = "0.1.0"
description = "GPT-Fast with Proton Annotations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "blobfile>=3.1.0",
    "huggingface-hub>=1.1.5",
    "llnl-hatchet>=2025.1.1",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "safetensors>=0.7.0",
    "sentencepiece>=0.2.1",
    "tiktoken>=0.12.0",
    "torch",
    "torchvision",
    "triton",
]

[project.optional-dependencies]
cuda = [
    "torch==2.9.1+cu128",
    "torchvision"
]
rocm = [
    "torch",
    "torchvision",
]

[tool.uv]
override-dependencies = [
    "pytorch-triton-rocm; sys_platform == 'never'",
    "triton"
]

conflicts = [
    [
        {extra = "cuda"},
        {extra = "rocm"}
    ],
]

[tool.uv.sources]
triton = { path = "./submodules/triton", editable=true}
torch = [ 
    { index = "pytorch", extra = "cuda"},
    { url =  "https://download.pytorch.org/whl/nightly/rocm7.0/torch-2.10.0.dev20251116%2Brocm7.0-cp313-cp313-manylinux_2_28_x86_64.whl", extra = "rocm"},
]
torchvision = [
    { index = "pytorch", extra = "cuda" },
    { url = "https://download.pytorch.org/whl/nightly/rocm7.0/torchvision-0.25.0.dev20251117%2Brocm7.0-cp313-cp313-manylinux_2_28_x86_64.whl", extra = "rocm"}
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
